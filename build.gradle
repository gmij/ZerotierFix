// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.greenrobot:greendao-gradle-plugin:3.3.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def zeroTierCoreDir = file("${rootDir}/externals/core")
def zeroTierCoreJavaDir = file("${rootDir}/externals/core/java/src")
def zeroTierCoreNodeDir = file("${rootDir}/externals/core/node")

tasks.register("ensureZeroTierCoreSubmodule") {
    group = "build setup"
    description = "Ensure ZeroTier SDK submodule (externals/core) is available before compile."
    doLast {
        if (zeroTierCoreJavaDir.exists() && zeroTierCoreNodeDir.exists()) {
            return
        }
        logger.lifecycle("ZeroTier SDK submodule missing, trying to initialize externals/core ...")
        def cmdOut = new ByteArrayOutputStream()
        def cmdErr = new ByteArrayOutputStream()
        def result = exec {
            workingDir rootDir
            commandLine "git", "submodule", "update", "--init", "--recursive", "externals/core"
            standardOutput cmdOut
            errorOutput cmdErr
            ignoreExitValue true
        }
        if (result.exitValue != 0 || !zeroTierCoreJavaDir.exists() || !zeroTierCoreNodeDir.exists()) {
            throw new GradleException(
                    "ZeroTier SDK submodule is missing. Run:\n" +
                            "  git submodule update --init --recursive externals/core\n" +
                            "or clone with:\n" +
                            "  git clone --recursive <repo-url>\n" +
                            "git output:\n" +
                            (cmdOut.toString("UTF-8") + cmdErr.toString("UTF-8")).trim()
            )
        }
        logger.lifecycle("ZeroTier SDK submodule ready: ${zeroTierCoreDir}")
    }
}

ext {
    compileSdkVersion = 33
    minSdkVersion = 21
    targetSdkVersion = 33
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

gradle.projectsEvaluated {
    rootProject.subprojects.each { p ->
        p.tasks.matching { it.name == "preBuild" }.configureEach {
            dependsOn(rootProject.tasks.named("ensureZeroTierCoreSubmodule"))
        }
    }
}
