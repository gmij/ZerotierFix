name: Build APP

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

# 同一分支/PR 只保留最新一次构建，新推送自动取消旧的进行中任务
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0  # 获取完整历史，用于生成changelog
      
      # 设置JDK环境
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      
      # 设置Gradle权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # 解码并创建密钥库文件
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            # 确保创建在项目根目录下
            echo "$ENCODED_KEYSTORE" | base64 --decode > zerotierfix.keystore
            ls -la zerotierfix.keystore
          else
            echo "No keystore found, will build unsigned APK"
          fi
      
      # 下载最新的智能路由数据文件并打包进 assets
      # 优先使用 jsDelivr CDN（国内可访问），主源失败时回退到 raw.githubusercontent.com
      - name: Download Smart Routing Data Files
        run: |
          mkdir -p app/src/main/assets

          echo "=== 下载 gfwlist.txt ==="
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://cdn.jsdelivr.net/gh/gfwlist/gfwlist@master/gfwlist.txt" \
            -o app/src/main/assets/gfwlist.txt \
          || curl -fsSL --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt" \
            -o app/src/main/assets/gfwlist.txt
          echo "gfwlist.txt: $(wc -c < app/src/main/assets/gfwlist.txt) bytes"

          echo "=== 下载 chnroutes.txt ==="
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://cdn.jsdelivr.net/gh/17mon/china_ip_list@master/china_ip_list.txt" \
            -o app/src/main/assets/chnroutes.txt \
          || curl -fsSL --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/17mon/china_ip_list/master/china_ip_list.txt" \
            -o app/src/main/assets/chnroutes.txt
          echo "chnroutes.txt: $(wc -c < app/src/main/assets/chnroutes.txt) bytes"

      # 直接构建Release APK，不再专门构建Debug APK
      - name: Build Release APK
        env:
          # 使用相对路径，让 build.gradle 处理
          ZEROTIERFIX_KEYSTORE_FILE: zerotierfix.keystore
          ZEROTIERFIX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZEROTIERFIX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZEROTIERFIX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      
      # 只上传Release构建产物
      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
      
      # 重命名 APK，并按分支决定正式版/预发布
      - name: Rename APK with version
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success()
        run: |
          VERSION="1.0.${{ github.run_number }}"
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9._-]#-#g')

          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAG="v${VERSION}"
            RELEASE_NAME="ZerotierFix v${VERSION}"
            PRERELEASE="false"
          else
            TAG="v${VERSION}-${BRANCH_NAME}"
            RELEASE_NAME="ZerotierFix v${VERSION} (${BRANCH_NAME} prerelease)"
            PRERELEASE="true"
          fi

          cp app/build/outputs/apk/release/app-release.apk "ZerotierFix-${TAG}.apk"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "PRERELEASE=${PRERELEASE}" >> $GITHUB_ENV
          echo "APK_FILE=ZerotierFix-${TAG}.apk" >> $GITHUB_ENV
      
      # 生成变更日志
      - name: Generate Changelog
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success()
        run: |
          echo "# ${RELEASE_NAME}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 📦 构建信息 / Build Information" >> RELEASE_NOTES.md
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TYPE="Prerelease"
          else
            RELEASE_TYPE="Stable"
          fi
          echo "- **版本号 / Version:** ${TAG}" >> RELEASE_NOTES.md
          echo "- **发布类型 / Release Type:** ${RELEASE_TYPE}" >> RELEASE_NOTES.md
          echo "- **构建号 / Build Number:** ${{ github.run_number }}" >> RELEASE_NOTES.md
          echo "- **构建日期 / Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> RELEASE_NOTES.md
          echo "- **提交 / Commit:** ${{ github.sha }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 📝 更新内容 / Changelog" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          # 获取上一个tag，如果没有则从第一个commit开始
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # 生成commit历史
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges >> RELEASE_NOTES.md
          else
            echo "Initial release with all commits:" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s (%h)" --no-merges >> RELEASE_NOTES.md
          fi
          
          echo "" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 📥 下载 / Download" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "下载 \`${APK_FILE}\` 文件并安装到您的Android设备。" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Download \`${APK_FILE}\` and install it on your Android device." >> RELEASE_NOTES.md
          
          cat RELEASE_NOTES.md
      
      # 创建 GitHub Release（master 为正式版，其他分支为预发布）
      - name: Create Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: ${{ env.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
